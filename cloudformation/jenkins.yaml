AWSTemplateFormatVersion: '2010-09-09'
Description: SmartPackingAgent Jenkins EC2 server

Parameters:
  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

  AllowedCidr:
    Type: String
    Description: Your public IP address followed by /32, for example 203.0.113.10/32
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/32$'

Resources:
  JenkinsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow Jenkins web access only from the specified IP
      VpcId:
        Fn::ImportValue: SmartPacking-VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: !Ref AllowedCidr
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: SmartPacking-Jenkins-SG

  JenkinsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: SmartPackingECRAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:DescribeRepositories
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:ListImages
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: arn:aws:ecr:ap-south-1:152732246709:repository/smartpacking-agent

  JenkinsInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref JenkinsRole

  JenkinsInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestUbuntuAmi
      InstanceType: t3.small
      IamInstanceProfile: !Ref JenkinsInstanceProfile
      SubnetId:
        Fn::ImportValue: SmartPacking-PublicSubnetA
      SecurityGroupIds:
        - !Ref JenkinsSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: SmartPacking-Jenkins
      UserData:
        Fn::Base64:
          Fn::Sub: |
            #!/bin/bash
            set -euxo pipefail
            exec > >(tee /var/log/smartpacking-setup.log) 2>&1

            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get upgrade -y
            DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl gnupg unzip git fontconfig openjdk-21-jre docker.io

            systemctl enable --now docker

            install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key -o /etc/apt/keyrings/jenkins-keyring.asc
            echo "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/" > /etc/apt/sources.list.d/jenkins.list
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y jenkins
            usermod -aG docker jenkins
            systemctl enable jenkins
            systemctl restart jenkins

            curl -fsSL https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip -o /tmp/awscliv2.zip
            unzip -q /tmp/awscliv2.zip -d /tmp
            /tmp/aws/install
            rm -rf /tmp/aws /tmp/awscliv2.zip

            curl -fsSL https://dl.k8s.io/release/$(curl -fsSL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl -o /usr/local/bin/kubectl
            chmod +x /usr/local/bin/kubectl

            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin

            systemctl restart jenkins

Outputs:
  JenkinsInstanceId:
    Description: New Jenkins EC2 instance ID
    Value: !Ref JenkinsInstance

  JenkinsPublicIp:
    Description: Jenkins EC2 public IP
    Value: !GetAtt JenkinsInstance.PublicIp

  JenkinsURL:
    Description: Jenkins web address
    Value: !Sub 'http://${JenkinsInstance.PublicIp}:8080'

  JenkinsRoleArn:
    Description: IAM role attached to Jenkins EC2
    Value: !GetAtt JenkinsRole.Arn
    Export:
      Name: SmartPacking-JenkinsRoleArn
